# advisory/messages/kn.yaml
_review_status: unreviewed
language: kn

titles:
  heavy_rain_title: "ಭಾರೀ ಮಳೆ ಮುನ್ಸೂಚನೆ ಎಚ್ಚರಿಕೆ"
  irrigation_title: "ನೀರಾವರಿ ವೇಳಾಪಟ್ಟಿ ಶಿಫಾರಸು"
  heat_stress_title: "ಶಾಖದ ಒತ್ತಡದ ಎಚ್ಚರಿಕೆ"
  cold_risk_title: "ಶೀತ ಮಾರುತದ ಎಚ್ಚರಿಕೆ"
  waterlogging_title: "ನೀರು ನಿಲ್ಲುವಿಕೆ ಮತ್ತು ಬಸಿಗಾಲುವೆ ಪರಿಶೀಲನೆ"
  spraying_title: "ಔಷಧ ಸಿಂಪಡಣೆ ಕಾರ್ಯಾಚರಣೆ"
  sowing_title: "ಬಿತ್ತನೆಗೆ ತೇವಾಂಶದ ಅವಕಾಶ"
  normal_weather_title: "ಸಾಮಾನ್ಯ ಹವಾಮಾನ ಕೃಷಿ ಸಲಹೆ"

messages:
  heavy_rain_msg: "ಭಾರೀ ಮಳೆಯಾಗುವ ಸಾಧ್ಯತೆಯಿದೆ ({heavy_rain_mm} ಮಿಮೀ ಗಿಂತ ಹೆಚ್ಚು, {rain_probability_pct}% ಸಂಭವನೀಯತೆ). ನೀರಾವರಿ ಮುಂದೂಡಿ ಮತ್ತು ಹೊಲಗಳಲ್ಲಿ ನೀರು ಸರಾಗವಾಗಿ ಹರಿದುಹೋಗಲು ಬಸಿಗಾಲುವೆಗಳನ್ನು ತೆರವುಗೊಳಿಸಿ."
  irrigation_msg: "ದೀರ್ಘಾವಧಿಯ ಒಣ ಹವೆ ಕಂಡುಬಂದಿದೆ ({days_since_last_rain} ದಿನಗಳಿಂದ ಮಳೆಯಾಗಿಲ್ಲ, ಮಳೆ ಸಂಭವನೀಯತೆ 20% ಗಿಂತ ಕಡಿಮೆ). ಮೇಲ್ಮಣ್ಣು ಒಣಗಿದ್ದರೆ ಲಘು ನೀರಾವರಿ ನೀಡಿ."
  heat_stress_msg: "ಗರಿಷ್ಠ ತಾಪಮಾನ {tmax_p50}°C ತಲುಪುವ ಸಾಧ್ಯತೆಯಿದೆ ({heat_c}°C ಮಿತಿ ಮೀರಿದೆ). ಹೂವು ಉದುರುವುದನ್ನು ತಡೆಯಲು ಸಂಜೆಯ ವೇಳೆ ಲಘು ನೀರಾವರಿ ನೀಡಿ."
  cold_risk_msg: "ಕನಿಷ್ಠ ತಾಪಮಾನ {tmin_p50}°C ಗೆ ಇಳಿಯುವ ಮುನ್ಸೂಚನೆ ಇದೆ ({cold_c}°C ಗಿಂತ ಕಡಿಮೆ). ಬೆಳೆ ಸಂರಕ್ಷಣೆಗೆ ಹೊಲದ ಅಂಚುಗಳಲ್ಲಿ ಹೊಗೆ ಹಾಕಿ ಅಥವಾ ಲಘು ನೀರಾವರಿ ನೀಡಿ."
  waterlogging_msg: "ಕಳೆದ 3 ದಿನಗಳಲ್ಲಿ {rain_3d_sum} ಮಿಮೀ ಮಳೆಯಾಗಿದೆ. ಬೇರು ಕೊಳೆಯುವುದನ್ನು ತಪ್ಪಿಸಲು ಹೊಲದಿಂದ ಹೆಚ್ಚುವರಿ ನೀರನ್ನು ಹೊರಹಾಕಿ."
  spraying_avoid_msg: "ಮಳೆಯಾಗುವ ಸಂಭವನೀಯತೆ ಹೆಚ್ಚಿದೆ ({rain_probability_pct}%). ರಸಗೊಬ್ಬರ ಅಥವಾ ಕೀಟನಾಶಕ ಸಿಂಪಡಿಸುವುದನ್ನು ತಕ್ಷಣ ನಿಲ್ಲಿಸಿ."
  sowing_window_msg: "ಇತ್ತೀಚಿನ ಮಳೆಯಿಂದ ({rain_7d_sum} ಮಿಮೀ) ಮಣ್ಣಿನಲ್ಲಿ ಸಮರ್ಪಕ ತೇವಾಂಶ ಸಂಗ್ರಹವಾಗಿದೆ. ಬಿತ್ತನೆ ಮಾಡಲು ಅಥವಾ ಮಡಿ ಸಿದ್ಧಪಡಿಸಲು ಇದು ಸೂಕ್ತ ಸಮಯ."
  normal_weather_msg: "ಮುಂದಿನ ದಿನಗಳಲ್ಲಿ ಹವಾಮಾನ ಸಾಮಾನ್ಯವಾಗಿದೆ. ನಿಯಮಿತ ಕಳೆ ಕೀಳುವುದು, ಗೊಬ್ಬರ ಹಾಕುವುದು ಮುಂತಾದ ಕೃಷಿ ಕೆಲಸಗಳನ್ನು ಮುಂದುವರಿಸಬಹುದು."

confidence_phrases:
  low: "ವಿಶ್ವಾಸಾರ್ಹ ಮುನ್ಸೂಚನೆ"
  medium: "ಮಧ್ಯಮ ವಿಶ್ವಾಸ"
  high: "ಮುನ್ಸೂಚನೆಯು ಅನಿಶ್ಚಿತವಾಗಿದೆ; ದಯವಿಟ್ಟು ನಾಳೆ ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ."

disclaimer: "ಉದಾಹರಣಾತ್ಮಕ ಕೃಷಿ ಸಲಹಾ ನಿಯಮಗಳು. ನೈಜ ಬಳಕೆಗೆ ಮುನ್ನ ನಿಮ್ಮ ಸ್ಥಳೀಯ ಕೃಷಿ ವಿಜ್ಞಾನ ಕೇಂದ್ರ / ಕೃಷಿ ವಿಶ್ವವಿದ್ಯಾಲಯದೊಂದಿಗೆ ದೃಢೀಕರಿಸಿ."
