messages:
  heavy_rain_msg: "मुसळधार पावसाची शक्यता आहे ({heavy_rain_mm} मिमी पेक्षा जास्त, {rain_probability_pct}% शक्यता). सिंचन त्वरित थांबवा आणि शेतातील पाण्याचा निचरा करण्यासाठी चर मोकळे करा."
  irrigation_msg: "दीर्घकाळ कोरडे हवामान आढळले आहे ({days_since_last_rain} दिवस पाऊस नाही, पावसाची शक्यता २०% पेक्षा कमी). पिकांच्या संवेदनशील अवस्थेत हलके सिंचन द्या."
  heat_stress_msg: "कमाल तापमान {tmax_p50}°C पर्यंत पोहोचण्याचा अंदाज आहे (मर्यादा {heat_c}°C पेक्षा जास्त). फुलगळ रोखण्यासाठी संध्याकाळी हलके पाणी द्या."
  cold_risk_msg: "किमान तापमान {tmin_p50}°C पर्यंत खाली येण्याचा अंदाज आहे ({cold_c}°C पेक्षा कमी). पिकांचे थंडीपासून रक्षण करण्यासाठी रात्री हलके पाणी द्या किंवा शेताच्या बांधावर धूर करा."
  waterlogging_msg: "गेल्या ३ दिवसांत एकूण {rain_3d_sum} मिमी पाऊस झाला आहे. शेतात पाणी साचण्याची दाट शक्यता असल्याने चर खोदून पाण्याचा निचरा करा."
  spraying_avoid_msg: "पावसाची शक्यता जास्त आहे ({rain_probability_pct}%). कीटकनाशक किंवा खतांची फवारणी टाळा कारण औषध वाहून जाण्याची शक्यता आहे."
  sowing_window_msg: "गेल्या ७ दिवसांतील पावसामुळे ({rain_7d_sum} मिमी) जमिनीत पुरेशी ओल तयार झाली आहे. पेरणी किंवा रोपवाटिका तयार करण्यासाठी हा अनुकूल काळ आहे."
  normal_weather_msg: "पुढील दिवसांत हवामान सामान्य राहण्याचा अंदाज आहे. नेहमीची आंतरमशागत, खते देणे व इतर शेतीकामे सुरू ठेवावीत."

confidence_phrases:
  low: "विश्वसनीय अंदाज"
  medium: "मध्यम विश्वास"
  high: "अंदाज अनिश्चित आहे; कृपया उद्या पुन्हा तपासा."

disclaimer: "मार्गदर्शक कृषी सल्ला नियम. प्रत्यक्ष वापरापूर्वी स्थानिक कृषी विज्ञान केंद्र (KVK) किंवा कृषी विद्यापीठाशी संपर्क साधावा."
