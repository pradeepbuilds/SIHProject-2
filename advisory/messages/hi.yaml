# advisory/messages/hi.yaml
_review_status: unreviewed
language: hi

titles:
  heavy_rain_title: "भारी वर्षा की चेतावनी"
  irrigation_title: "सिंचाई समय-सारणी सलाह"
  heat_stress_title: "ताप तनाव (लू) चेतावनी"
  cold_risk_title: "शीतलहर एवं पाला चेतावनी"
  waterlogging_title: "जलभराव एवं जल निकासी निगरानी"
  spraying_title: "कीटनाशक छिड़काव सलाह"
  sowing_title: "बुवाई नमी अनुकूलता"
  normal_weather_title: "सामान्य मौसम कृषि सलाह"

messages:
  heavy_rain_msg: "भारी बारिश की संभावना है ({heavy_rain_mm} मिमी से अधिक, {rain_probability_pct}% संभावना)। सिंचाई तुरंत स्थगित करें और खेतों में जल निकासी नालियों को खोलें।"
  irrigation_msg: "लंबे समय से सूखा देखा गया है ({days_since_last_rain} दिनों से वर्षा नहीं, वर्षा की संभावना 20% से कम)। यदि ऊपरी मिट्टी शुष्क है तो हल्की सिंचाई की योजना बनाएं।"
  heat_stress_msg: "अधिकतम तापमान {tmax_p50}°C तक पहुंचने की संभावना है (सीमा {heat_c}°C से अधिक)। फूलों को झड़ने से बचाने के लिए शाम को हल्की सिंचाई करें।"
  cold_risk_msg: "न्यूनतम तापमान {tmin_p50}°C तक गिरने का अनुमान है (सीमा {cold_c}°C से नीचे)। पाले से बचाव के लिए खेत की मेड़ों पर धुआं करें या हल्की सिंचाई करें।"
  waterlogging_msg: "पिछले 3 दिनों में कुल {rain_3d_sum} मिमी बारिश दर्ज की गई है। जलजमाव का खतरा है, जड़ों को सड़न से बचाने के लिए पानी निकालने की व्यवस्था करें।"
  spraying_avoid_msg: "बारिश की संभावना अधिक है ({rain_probability_pct}%)। कीटनाशक या उर्वरक का छिड़काव न करें क्योंकि दवा धुलने का खतरा है।"
  sowing_window_msg: "हाल ही में पर्याप्त बारिश ({rain_7d_sum} मिमी 7 दिनों में) से मिट्टी में अच्छी नमी है। यह बुवाई अथवा नर्सरी तैयार करने का उपयुक्त समय है।"
  normal_weather_msg: "आगामी दिनों में मौसम सामान्य रहने की संभावना है। नियमित निराई-गुड़ाई, खाद एवं कृषि कार्य सामान्य रूप से जारी रख सकते हैं।"

confidence_phrases:
  low: "विश्वसनीय पूर्वानुमान"
  medium: "मध्यम स्तर का विश्वास"
  high: "पूर्वानुमान अनिश्चित है; कृपया कल पुनः जांचें।"

disclaimer: "उदाहरणात्मक कृषि सलाह नियम। वास्तविक उपयोग से पहले अपने स्थानीय केवीके / कृषि विश्वविद्यालय से पुष्टि करें।"
