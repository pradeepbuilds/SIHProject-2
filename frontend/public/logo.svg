  <line x1="54" y1="12" x2="52.5" y2="13.5" stroke="#F6E05E" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="18" x2="54" y2="18" stroke="#F6E05E" stroke-width="2" stroke-linecap="round" />

  <!-- Sprout Main Stem -->
