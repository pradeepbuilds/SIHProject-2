      <stop offset="0%" stopColor="#1B4D2E"/>
      <stop offset="100%" stopColor="#2E6B3F"/>
    </linearGradient>
    <linearGradient id="kmSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
