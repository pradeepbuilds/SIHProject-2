services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d weatherdb"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "krishimitra.cli", "seed", "--all"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/weatherdb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/weatherdb
      ADMIN_API_KEY: dev-admin-key-krishimitra
      FORECAST_PROVIDER: synthetic
      FEATURE_PROVIDER: synthetic
      OBSERVATION_PROVIDER: synthetic
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

volumes:
  pgdata:
